@if (movie) {
  <section
    class="movie-details"
    [style.background-image]="'linear-gradient(90deg, #0a0a0c 0%, rgba(10, 10, 12, 0.88) 48%, rgba(10, 10, 12, 0.42) 100%), url(' + movie.backdropUrl + ')'"
  >
    <div class="movie-details__poster">
      <img [src]="movie.posterUrl" [alt]="movie.title + ' poster'" />
    </div>

    <div class="movie-details__content">
      <a class="movie-details__back-link" routerLink="/">Back to home</a>

      <p class="movie-details__eyebrow">Movie Details</p>

      <h1>{{ movie.title }}</h1>

      <div class="movie-details__meta">
        <span>{{ movie.releaseYear }}</span>
        <span>{{ movie.rating }}/10</span>
        <span>{{ movie.genres.join(', ') }}</span>
      </div>

      <p class="movie-details__overview">
        {{ movie.overview }}
      </p>

      <div class="movie-details__actions">
        <button type="button">Add to Vault</button>
        <button type="button" class="movie-details__secondary-button">
          Write Review
        </button>
      </div>
    </div>
  </section>
} @else {
  <section class="movie-details movie-details--empty">
    <h1>Movie not found</h1>
    <p>The movie you are looking for does not exist in the current dummy data.</p>
    <a routerLink="/">Go back home</a>
  </section>
}
