<div class="search-container">
  <div class="search-header">
    <h1>Search Movies & TV Shows</h1>
    <input 
      type="text" 
      class="search-input" 
      [formControl]="searchControl" 
      placeholder="Type a title... (e.g. Breaking Bad, Inception)"
      autocomplete="off" 
      spellcheck="false"
      autofocus
    >
  </div>

  @if (isSearching) {
    <div class="loader-container"><div class="spinner"></div></div>
  }

  @if (!isSearching && searchResults.length > 0) {
    <div class="movies-grid">
      @for (movie of searchResults; track movie.id) {
        <app-movie-card [movie]="movie"></app-movie-card>
      }
    </div>
  }

  @if (!isSearching && searchControl.value && searchResults.length === 0) {
    <div class="empty-state">
      <h2>No titles found for "{{ searchControl.value }}"</h2>
    </div>
  }
</div>
