<section class="search-page">
  <div class="search-page__header">
    <p class="search-page__eyebrow">Discover</p>
    <h1>Search Movies</h1>
    <p>Find movies from the current CineVault dummy library.</p>
  </div>

  <label class="search-page__field">
    <span>Movie title</span>
    <input
      type="text"
      placeholder="Search Interstellar, Dune, Batman..."
      [(ngModel)]="searchTerm"
    />
  </label>

  <div class="search-page__summary">
    {{ filteredMovies.length }} result(s)
  </div>

  @if (filteredMovies.length > 0) {
    <div class="search-page__grid">
      @for (movie of filteredMovies; track movie.id) {
        <app-movie-card [movie]="movie" />
      }
    </div>
  } @else {
    <div class="search-page__empty">
      <h2>No movies found</h2>
      <p>Try searching with a different movie title.</p>
    </div>
  }
</section>
