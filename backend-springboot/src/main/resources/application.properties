spring.application.name=backend
# 1. Map Java to your local network connection and the 'cinevault' database drawer
spring.datasource.url=jdbc:mysql://localhost:3306/cinevault?useSSL=false&serverTimezone=UTC

# 2. Provide your exact database admin login credentials
spring.datasource.username=root
spring.datasource.password=akshaymandem

# 3. Use the modern communication driver engine
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 4. HIBERNATE MAGIC: Automatically generate or update SQL tables to match our Java objects
spring.jpa.hibernate.ddl-auto=update

# 5. Echo all active database operations into your terminal for easy debugging
spring.jpa.show-sql=true

openai.api.key=${OPENAI_API_KEY}